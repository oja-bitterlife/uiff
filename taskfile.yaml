# taskfile-go
version: 3

vars:
  title_json: assets/title.json
  bin_file: assets/title.uiff

tasks:
  data_mk:
    desc: yamlをuiffに変換する
    cmds:
      - yq -o json assets/title.yaml > {{.title_json}}
      - python compiler/uiff_conv_test.py {{.title_json}} -def assets/defines.json | xxd -r -p > {{.bin_file}}

  data_hex:
    desc: yamlをuiffの16進数で出力する
    cmds:
      - yq -o json assets/title.yaml > {{.title_json}}
      - python compiler/uiff_conv_test.py {{.title_json}} -def assets/defines.json

  data_ck:
    desc: uiffを確認する
    cmds:
      - python compiler/uiff_check.py {{.bin_file}}

  default:
    cmds:
      - task --list

