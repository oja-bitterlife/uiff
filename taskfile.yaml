# taskfile-go
version: 3

vars:
  COMPILER_DIR: _COMPILER
  TITLE_JSON: build/title.json
  TITLE_BIN: build/title.uiff
  TEST_SCRIPT: "{{.COMPILER_DIR}}/uiff_conv_sample.py"

tasks:
  data_mk:
    desc: yamlをuiffに変換する
    cmds:
      - mkdir -p build
      - yq -o json assets/title.yaml > {{.TITLE_JSON}}
      - python {{.TEST_SCRIPT}} {{.TITLE_JSON}} -def assets/defines.json -o {{.TITLE_BIN}}

  data_hex:
    desc: yamlをuiffの16進数で出力する
    cmds:
      - yq -o json assets/title.yaml > {{.TITLE_JSON}}
      - python {{.TEST_SCRIPT}} {{.TITLE_JSON}} -def assets/defines.json

  data_ck:
    desc: uiffを確認する
    cmds:
      - python {{.COMPILER_DIR}}/uiff_check.py {{.TITLE_BIN}}

  run:
    desc: uiffを実行する
    cmds:
      - swift run --package-path swiftUI

  build:
    desc: uiffをビルドする
    cmds:
      - swift build --package-path swiftUI

  clean:
    desc: clean up generated files
    cmds:
      - rm -f {{.TITLE_JSON}} {{.TITLE_BIN}}

  default:
    cmds:
      - task --list

