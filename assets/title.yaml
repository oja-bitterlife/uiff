- Type: TYPE_WINDOW
  MyProp: 0x1234
  W: 30
  H: 20
  Colors: [0xffffff, 0xa0c0ff]
  Events: [EVENT_WIN_CLOSE]
  children:
  - Type: TYPE_LAYOUT  # タイトルロゴ
    X: -10
    Y: 2
    Extend: true
  - Type: TYPE_LAYOUT  # スタートメニュー
    children:
    - Type: TYPE_SELECT
      SubType: TITLE_START
      SelRows: 1  # 縦並び
      SelItems: ["START", "CONTINUE"]
      Events: [EVENT_KEY_UP, EVENT_KEY_DOWN, EVENT_KEY_START]
      Script: |-
        from assets.vm import *
        def main():
          if VM[VM_EVENT] == EVENT_KEY_START:
            VM[VM_NOTIFY] = EVENT_WIN_CLOSE
            match VM[VM_SELECT_NO]:
              case 0:  # START
                return 1
              case _:  # CONTINUE
                return 2
  - Type: TYPE_LAYOUT  # メッセージスピード
    Popup: true
    children:
    - Type: TYPE_LABEL
      AlignCenterX: true
      Text: "-MESSAGE SPEED-"
      X: 2
      Y: 1
      W: 15
      H: 1
    - Type: TYPE_SELECT
      SubType: TITLE_SPEED
      X: 1 
      Y: 2
      SelItems: ["SLOW", "NORMAL", "FAST"]
      Events: [EVENT_KEY_LEFT, EVENT_KEY_RIGHT]
