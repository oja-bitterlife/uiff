Type: TYPE_WINDOW
W: 30
H: 20
Colors: [0xffffff, 0x80c0ff]
Events: [EVENT_WIN_CLOSE]
children:
- Type: TYPE_WINDOW  # タイトルロゴ
  W: 20
  Y: 4
  H: 4
  Colors: [0xffffff, 0xffc0c0c0]
  AlignCenterX: true
- Type: TYPE_LAYOUT  # スタートメニュー
  X: 0
  Y: 10
  W: 30
  Popup: true
  children:
  - Type: TYPE_SELECT
    SubType: TITLE_START
    X: 12
    W: 8
    H: 2
    SelRows: 1  # 縦並び
    SelItems: ["START", "CONTINUE"]
    Events: [EVENT_KEY_UP, EVENT_KEY_DOWN, EVENT_KEY_START]
    Script: |-
      from assets.vm import *
      def main():
        if VM[VM_EVENT] == EVENT_KEY_START:
          VM[VM_NOTIFY] = EVENT_WIN_CLOSE
          match VM[VM_SELECT_NO]:
            case 0:  # START
              return 1
            case _:  # CONTINUE
              return 2
- Type: TYPE_LAYOUT  # メッセージスピード
  Y: 15
  W: 30
  H: 20
  Popup: true
  children:
  - Type: TYPE_LABEL
    AlignCenterX: true
    Text: "-MESSAGE SPEED-"
    W: 15
    H: 1
  - Type: TYPE_SELECT
    SubType: TITLE_SPEED
    X: 1 
    Y: 2
    SelItems: ["SLOW", "NORMAL", "FAST"]
    Events: [EVENT_KEY_LEFT, EVENT_KEY_RIGHT]

